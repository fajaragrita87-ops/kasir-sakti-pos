<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Meta -->
    <title>VISTRAL POS — Pay As You Go · Platform Kasir Bisnis Modern Indonesia</title>
    <meta name="description" content="Aplikasi kasir & POS pintar untuk UMKM Indonesia. Kelola penjualan, stok, laporan, dan lebih banyak lagi. Gratis, mudah, dan bisa dipakai offline." />
    <meta name="keywords" content="kasir, POS, aplikasi kasir, UMKM, point of sale, kasir digital, kasir gratis" />
    <meta name="author" content="VISTRAL POS by Zyntra Labs" />
    <meta name="robots" content="index, follow" />

    <!-- PWA Meta Tags -->
    <meta name="application-name" content="VISTRAL POS" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VISTRAL POS" />
    <meta name="msapplication-TileColor" content="#1e3a8a" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />

    <!-- Open Graph (untuk preview saat di-share di WhatsApp, dll) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VISTRAL POS — Pay As You Go · Platform Kasir Modern" />
    <meta property="og:description" content="VISTRAL POS — Platform kasir Pay As You Go terlengkap. Gratis untuk kasir dasar, bayar hanya fitur yang Anda gunakan." />
    <meta property="og:image" content="/icons/icon.svg" />
    <meta property="og:locale" content="id_ID" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VISTRAL POS — Pay As You Go" />
    <meta name="twitter:description" content="Platform kasir Pay As You Go modern untuk bisnis Indonesia" />
    <meta name="twitter:image" content="/icons/icon.svg" />

    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Splash Screens for iPhone -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator && window.location.hostname !== 'localhost') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('[VISTRAL POS] Service Worker registered:', reg.scope);
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New version available — could show "update available" toast
                    window.dispatchEvent(new CustomEvent('pwa-update-available'));
                  }
                });
              });
            })
            .catch(err => console.warn('[VISTRAL POS] SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
