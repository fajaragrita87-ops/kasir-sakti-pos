<html lang="id">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Meta -->
    <title>Kasir Sakti POS — Kasir Pintar untuk UMKM Indonesia</title>
    <meta name="description" content="Aplikasi kasir & POS pintar untuk UMKM Indonesia. Kelola penjualan, stok, laporan, dan lebih banyak lagi. Gratis, mudah, dan bisa dipakai offline." />
    <meta name="keywords" content="kasir, POS, aplikasi kasir, UMKM, point of sale, kasir digital, kasir gratis" />
    <meta name="author" content="Kasir Sakti" />
    <meta name="robots" content="index, follow" />

    <!-- PWA Meta Tags -->
    <meta name="application-name" content="Kasir Sakti" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kasir Sakti" />
    <meta name="msapplication-TileColor" content="#1e3a8a" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72x72.png" />
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/icons/icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="/icons/icon-128x128.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- Open Graph (untuk preview saat di-share di WhatsApp, dll) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kasir Sakti POS — Kasir Pintar untuk UMKM" />
    <meta property="og:description" content="Kelola bisnis UMKM kamu dengan lebih mudah. Kasir digital, laporan otomatis, stok real-time." />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta property="og:locale" content="id_ID" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kasir Sakti POS" />
    <meta name="twitter:description" content="Aplikasi kasir pintar untuk UMKM Indonesia" />
    <meta name="twitter:image" content="/icons/icon-512x512.png" />

    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Splash Screens for iPhone -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('[Kasir Sakti] Service Worker registered:', reg.scope);
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New version available — could show "update available" toast
                    window.dispatchEvent(new CustomEvent('pwa-update-available'));
                  }
                });
              });
            })
            .catch(err => console.warn('[Kasir Sakti] SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
